  <style>
    :root{
      --brand:#ffd936; --brand-dark:#dab200; --ink:#1a1a1a; --muted:#555d66;
      --bg:#ffffff; --line:#eaeaea; --maxw:1120px;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color:var(--ink);background:var(--bg);line-height:1.65;font-size:17px}
    h1,h2,h3,h4{font-family:"Forum",Georgia,serif;line-height:1.25;margin:1.4em 0 .5em;font-weight:400}
    h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.3rem}
    a{color:var(--ink);text-decoration:none}
    a:hover{color:var(--brand-dark)}
    img{max-width:100%;height:auto}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

    /* Header */
    .site-header{position:sticky;top:0;z-index:50;background:var(--bg);
      border-bottom:1px solid var(--line)}
    .site-header .wrap{display:flex;align-items:center;justify-content:space-between;
      min-height:64px;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-family:"Forum",serif;
      font-size:1.15rem;color:var(--ink)}
    .brand img{width:40px;height:40px;border-radius:6px}
    .nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .nav a{padding:8px 14px;border-radius:999px;font-weight:500;color:var(--ink)}
    .nav a:hover{background:#faf6dd}
    .nav a.cta{background:var(--brand);color:var(--ink)}
    .nav a.cta:hover{background:var(--brand-dark)}

    /* Content */
    main{padding:28px 0 48px}
    main .wrap>*{max-width:820px}
    main img{border-radius:8px}

    /* Footer */
    .site-footer{background:#1a1a1a;color:#e7e7e7;margin-top:40px}
    .site-footer .wrap{padding:40px 20px 28px}
    .site-footer a{color:#e7e7e7}
    .site-footer a:hover{color:var(--brand)}
    .foot-top{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;
      align-items:center;padding-bottom:22px;border-bottom:1px solid #333}
    .foot-brand{font-family:"Forum",serif;font-size:1.2rem;color:#fff}
    .foot-nav{display:flex;gap:18px;flex-wrap:wrap}
    .wa-btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);
      color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700}
    .wa-btn:hover{background:var(--brand-dark);color:var(--ink)}
    .foot-bottom{padding-top:18px;color:#9aa0a6;font-size:.9rem}

    @media(max-width:640px){
      body{font-size:16px} h1{font-size:1.7rem}
      .site-header .wrap{flex-direction:column;align-items:flex-start;padding-top:10px;padding-bottom:10px}
    }
  </style>
</head>
